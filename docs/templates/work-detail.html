<!doctype html>
<!-- works/<slug>/index.html にコピーしてから {{...}} をすべて置き換えてください。 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{SUMMARY}}">
  <meta name="theme-color" content="#030815">
  <title>{{TITLE}} — れふれふ</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
</head>
<body data-page="work-detail">
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <canvas id="lunar-field" aria-hidden="true"></canvas>
  <div class="static-nebula lunar-fallback" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="../../index.html" aria-label="れふれふ Profile">
      <img class="brand-mark" src="../../assets/images/lef-lef-avatar.png" width="512" height="512" alt="" aria-hidden="true">
      <span class="brand-name">れふれふ</span>
    </a>
    <nav class="site-nav" aria-label="メインナビゲーション">
      <a href="../../index.html">PROFILE</a>
      <a href="../../works.html" aria-current="page">WORKS</a>
      <a href="../../contact.html">CONTACT</a>
    </nav>
  </header>

  <main id="main-content" class="page-shell work-detail-page">
    <a class="text-link work-detail-back" href="../../works.html"><span aria-hidden="true">←</span> WORKSへ戻る</a>

    <header class="work-detail-header">
      <div>
        <h1>{{TITLE}}</h1>
      </div>
    </header>

    <!-- 表紙。width / height は画像の実寸、alt は画像の説明に置き換えます。 -->
    <figure class="work-detail-visual work-detail-photo">
      <img
        class="work-detail-image"
        src="../../assets/images/works/{{SLUG}}/cover.jpg"
        width="{{COVER_WIDTH}}"
        height="{{COVER_HEIGHT}}"
        alt="{{COVER_ALT}}"
        fetchpriority="high"
        decoding="async"
      >
      <figcaption class="work-number">{{TITLE}} / {{CATEGORY}}</figcaption>
    </figure>

    <section class="work-detail-description" aria-label="作品について">
      <h2>{{CATCHPHRASE_LINE_1}}<br>{{CATCHPHRASE_LINE_2}}</h2>
      <!-- 補足説明は3〜5行を目安に、spanごとに追加・削除できます。 -->
      <p class="work-detail-summary">
        <span>{{DESCRIPTION_LINE_1}}</span>
        <span>{{DESCRIPTION_LINE_2}}</span>
        <span>{{DESCRIPTION_LINE_3}}</span>
        <span>{{DESCRIPTION_LINE_4}}</span>
      </p>
    </section>

    <section class="work-gallery-section" aria-labelledby="gallery-title">
      <header class="work-gallery-heading">
        <h2 id="gallery-title">DETAILS</h2>
      </header>
      <!-- 動画がある場合だけ data-work-video-url にURLを記入。空欄なら欄ごと非表示です。 -->
      <!-- YouTube / Vimeo URL、または ../../assets/videos/works/<slug>/demo.mp4 など。hiddenは残します。 -->
      <section class="work-video-section" data-work-video-url="" data-work-video-title="{{TITLE}} 作品動画" hidden aria-label="作品動画">
        <div class="work-video-frame"></div>
        <a class="text-link work-video-source" hidden>動画を開く ↗</a>
      </section>
      <!-- 画像は2列・16:9フレーム。figure単位でコピーまたは削除してください。 -->
      <div class="work-gallery">
        <figure class="work-gallery-item">
          <img
            src="../../assets/images/works/{{SLUG}}/detail-01.jpg"
            width="{{IMAGE_01_WIDTH}}"
            height="{{IMAGE_01_HEIGHT}}"
            alt="{{IMAGE_01_ALT}}"
            loading="lazy"
            decoding="async"
          >
          <figcaption>{{IMAGE_01_CAPTION}}</figcaption>
        </figure>
        <figure class="work-gallery-item">
          <img
            src="../../assets/images/works/{{SLUG}}/detail-02.jpg"
            width="{{IMAGE_02_WIDTH}}"
            height="{{IMAGE_02_HEIGHT}}"
            alt="{{IMAGE_02_ALT}}"
            loading="lazy"
            decoding="async"
          >
          <figcaption>{{IMAGE_02_CAPTION}}</figcaption>
        </figure>
      </div>
    </section>

    <section class="work-detail-tech" aria-labelledby="technology-title">
      <p id="technology-title" class="eyebrow">TECHNOLOGY</p>
      <!-- 使用技術はli単位で追加・削除。一覧カードにも同じ内容を記入します。 -->
      <ul class="work-tags" aria-label="使用技術">
        <li>{{TECHNOLOGY_1}}</li>
        <li>{{TECHNOLOGY_2}}</li>
      </ul>
    </section>

    <nav class="work-detail-actions" aria-label="作品ページの次のリンク">
      <a class="text-link" href="../../works.html">作品一覧を見る <span aria-hidden="true">↗</span></a>
      <a class="text-link" href="../../contact.html">Contactへ <span aria-hidden="true">↗</span></a>
    </nav>
  </main>

  <script type="module" src="../../assets/js/lunar-field.js"></script>
  <script type="module" src="../../assets/js/work-media.js"></script>
</body>
</html>
